server {
    listen 80;
    listen [::]:80;
    server_name guraseesayurveda.com www.guraseesayurveda.com;

    # Absolute path to public/ (not the project root)
    root /var/www/gurasees/public;
    index index.php;

    access_log /var/log/nginx/guraseesayurveda.access.log;
    error_log  /var/log/nginx/guraseesayurveda.error.log warn;

    client_max_body_size 16m;
    charset utf-8;

    # Block hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|sql|log|ini|bak|sh)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ^~ /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT  $document_root;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120s;
    }

    location ~* ^/assets/.*\.php$ {
        deny all;
    }
}
